modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''Ядро и Печать — блок-цель для боёв на физических конструкциях Sable / Create Aeronautics.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Sable намеренно необязателен: без него мод работает, отключается только
# поддержка физических конструкций (sublevel'ов).
[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "[2.0.3,)"
ordering = "AFTER"
side = "BOTH"
