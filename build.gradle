plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java {
    // NeoForge 21.1.x требует Java 21. Toolchain позволяет Gradle подтянуть её
    // самостоятельно, даже если в системе стоит только JDK 17.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

// --- Джарки модпака как compileOnly-зависимости ------------------------------
// Sable, FTB Teams, Create Big Cannons, JEI и Xaero's Minimap в игре
// необязательны: без любого из них мод запускается и просто отключает свою
// часть. Но собрать мод без них нельзя — классы-мосты к этим модам ссылаются
// на их типы напрямую, и javac без джарок их не скомпилирует. Джарок нет в
// git (они весят под двести мегабайт, см. .gitignore): их кладут в
// other_mods_in_modpack/ из сборки модпака. Чего не хватает, проверяет
// compileJava — и называет файлы поимённо, а не сотней ошибок javac.

// Sable не опубликован в публичном maven, поэтому берём джарку из модпака.
// Часть API (Pose3d/Pose3dc) лежит во вложенных jarjar-джарках, их надо
// распаковать.
def sableJar = file("other_mods_in_modpack/sable-neoforge-1.21.1-${sable_version}.jar")
def sableDepsDir = layout.buildDirectory.dir('sable-deps')

def extractSableNestedJars = tasks.register('extractSableNestedJars', Copy) {
    onlyIf { sableJar.exists() }
    if (sableJar.exists()) {
        from(zipTree(sableJar)) {
            include 'META-INF/jarjar/sable-companion-common-*.jar'
            include 'META-INF/jarjar/veil-*.jar'
        }
    }
    eachFile { it.relativePath = new RelativePath(true, it.name) }
    includeEmptyDirs = false
    into sableDepsDir
}

// FTB Teams. ftb-library и architectury нужны лишь для того, чтобы javac
// разрешил сигнатуры TeamManager.
def ftbJarFiles = [
        file("other_mods_in_modpack/ftb-teams-neoforge-${ftb_teams_version}.jar"),
        file("other_mods_in_modpack/ftb-library-neoforge-${ftb_library_version}.jar"),
        file("other_mods_in_modpack/architectury-${architectury_version}-neoforge.jar"),
]

// Xaero's Minimap — метки конвертеров на карте. Публичного API у мода нет,
// поэтому мост ходит по внутренним классам и обязан переживать их исчезновение.
def xaeroJar = file("other_mods_in_modpack/xaerominimap-neoforge-${minecraft_version}-${xaero_minimap_version}.jar")

// Create Big Cannons — Яростный снаряд наследует их снаряд, поэтому это
// единственная зависимость мода, без которой в игре часть содержимого не
// появится. Create и Ritchie's Projectile Library нужны лишь затем, чтобы javac
// разрешил сигнатуры, унаследованные снарядом.
def cbcJarFiles = [
        file("other_mods_in_modpack/createbigcannons-${cbc_version}.jar"),
        file("other_mods_in_modpack/create-${minecraft_version}-${create_version}.jar"),
        file("other_mods_in_modpack/ritchiesprojectilelib-${rpl_version}-neoforge.jar"),
]

// JEI — просмотрщик рецептов. Нужен затем, чтобы показать все возможные
// находки Замороженной органики: у неё случайный выход, и обычная запись
// рецепта врала бы одним предметом.
def jeiJar = file("other_mods_in_modpack/jei-${minecraft_version}-neoforge-${jei_version}.jar")

def modpackJars = [sableJar] + ftbJarFiles + cbcJarFiles + [jeiJar, xaeroJar]

dependencies {
    modpackJars.each { jar ->
        if (jar.exists()) {
            compileOnly files(jar)
        }
    }
    if (sableJar.exists()) {
        compileOnly fileTree(dir: sableDepsDir, include: '*.jar').builtBy(extractSableNestedJars)
    }
}

tasks.named('compileJava', JavaCompile).configure {
    doFirst {
        def missing = modpackJars.findAll { !it.exists() }
        if (!missing.isEmpty()) {
            throw new GradleException("Modpack jars are required to compile the mod's bridges to optional mods. "
                    + "Put them into other_mods_in_modpack/. Missing:\n"
                    + missing.collect { " - ${it.name}" }.join('\n'))
        }
    }
}

// Подстановка версий из gradle.properties в neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    // Без этого expand читает ресурсы в кодировке платформы и портит кириллицу.
    filteringCharset = 'UTF-8'

    def expandProps = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]

    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
