plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java {
    // NeoForge 21.1.x требует Java 21. Toolchain позволяет Gradle подтянуть её
    // самостоятельно, даже если в системе стоит только JDK 17.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Sable подключается как compileOnly-зависимость в фазе feat/sublevel-support.
    // Мод обязан собираться и работать без неё.
}

// Подстановка версий из gradle.properties в neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    // Без этого expand читает ресурсы в кодировке платформы и портит кириллицу.
    filteringCharset = 'UTF-8'

    def expandProps = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]

    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
