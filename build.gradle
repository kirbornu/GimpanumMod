plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java {
    // NeoForge 21.1.x требует Java 21. Toolchain позволяет Gradle подтянуть её
    // самостоятельно, даже если в системе стоит только JDK 17.
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

// --- Sable как локальная compileOnly-зависимость ---------------------------
// Sable не опубликован в публичном maven, поэтому берём джарку из модпака.
// Часть API (Pose3d/Pose3dc) лежит во вложенных jarjar-джарках, их надо
// распаковать. Если джарки нет — сборка обязана всё равно проходить, просто
// без поддержки sublevel'ов.
def sableJar = file("other_mods_in_modpack/sable-neoforge-1.21.1-${sable_version}.jar")
def sableDepsDir = layout.buildDirectory.dir('sable-deps')

def extractSableNestedJars = tasks.register('extractSableNestedJars', Copy) {
    onlyIf { sableJar.exists() }
    if (sableJar.exists()) {
        from(zipTree(sableJar)) {
            include 'META-INF/jarjar/sable-companion-common-*.jar'
            include 'META-INF/jarjar/veil-*.jar'
        }
    }
    eachFile { it.relativePath = new RelativePath(true, it.name) }
    includeEmptyDirs = false
    into sableDepsDir
}

// FTB Teams — тоже необязательная зависимость, тоже из модпака. ftb-library и
// architectury нужны лишь для того, чтобы javac разрешил сигнатуры TeamManager.
def ftbJars = files(
        "other_mods_in_modpack/ftb-teams-neoforge-${ftb_teams_version}.jar",
        "other_mods_in_modpack/ftb-library-neoforge-${ftb_library_version}.jar",
        "other_mods_in_modpack/architectury-${architectury_version}-neoforge.jar"
).filter { it.exists() }

// Open Parties and Claims — единственный клеймовый мод сборки с публичным API.
// Нужен только для компиляции моста; без него Контрольная точка работает, но
// чанк не клеймит.
def opacJar = file("other_mods_in_modpack/open-parties-and-claims-neoforge-${minecraft_version}-${opac_version}.jar")

dependencies {
    if (sableJar.exists()) {
        compileOnly files(sableJar)
        compileOnly fileTree(dir: sableDepsDir, include: '*.jar').builtBy(extractSableNestedJars)
    } else {
        logger.lifecycle("Sable jar not found at ${sableJar} — building without sublevel support.")
    }

    if (!ftbJars.isEmpty()) {
        compileOnly ftbJars
    } else {
        logger.lifecycle("FTB Teams jars not found — building without team support.")
    }

    if (opacJar.exists()) {
        compileOnly files(opacJar)
    } else {
        logger.lifecycle("Open Parties and Claims jar not found at ${opacJar} — building without claim support.")
    }
}

// Подстановка версий из gradle.properties в neoforge.mods.toml
tasks.named('processResources', ProcessResources).configure {
    // Без этого expand читает ресурсы в кодировке платформы и портит кириллицу.
    filteringCharset = 'UTF-8'

    def expandProps = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]

    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
